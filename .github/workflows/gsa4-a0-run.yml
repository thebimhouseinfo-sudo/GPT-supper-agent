name: GSA4 A0-R scoped Run extraction parity
on:
  pull_request:
    paths:
      - 'supabase/functions/gsa-mcp/run-execution-tools.ts'
      - 'supabase/functions/gsa-mcp/run/**'
      - 'test-lab/gsa4-run-extraction.test.cjs'
      - '.github/workflows/gsa4-a0-run.yml'
  workflow_dispatch:

jobs:
  run-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript parser
        run: npm install --no-save --ignore-scripts --no-package-lock --prefix /tmp/gsa4-a0-run typescript@5.9.3
      - name: Scoped registration, source parity, and authorization tests
        env:
          NODE_PATH: /tmp/gsa4-a0-run/node_modules
        run: node --test test-lab/gsa4-run-extraction.test.cjs
  deno-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/gsa-mcp/index.ts
