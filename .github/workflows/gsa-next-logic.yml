name: GSA NEXT runtime logic gate
on:
  push:
    branches: [main, 'experiment/gsa-m01-ua-control']
    paths:
      - 'supabase/functions/gsa-mcp/**'
      - 'test-lab/**'
      - 'skills/gsa-job-runtime/SKILL.md'
      - 'docs/architecture/**'
      - '.github/workflows/gsa-next-logic.yml'
  pull_request:
    paths:
      - 'supabase/functions/gsa-mcp/**'
      - 'test-lab/**'
      - 'skills/gsa-job-runtime/SKILL.md'
      - 'docs/architecture/AGENT-HARNESSES.md'
      - 'docs/architecture/EXECUTION-AND-REVIEW.md'
      - '.github/workflows/gsa-next-logic.yml'
  workflow_dispatch:

jobs:
  runtime-helper-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated TypeScript parser and production Hono router
        run: npm install --no-save --ignore-scripts --no-package-lock --prefix /tmp/gsa-next-test typescript@5.9.3 'hono@^4.9.7'
      - name: Run executable helper assertions and negative controls
        env:
          NODE_PATH: /tmp/gsa-next-test/node_modules
        run: node --test test-lab/gsa1-module-boundary.test.cjs test-lab/runtime-logic.test.cjs test-lab/project-branch-policy.test.cjs test-lab/reliability-runtime.test.cjs test-lab/reliability-cursor.test.cjs test-lab/llc58-plan-change.test.cjs test-lab/llc58-plan-intent.test.cjs test-lab/llc59-autonomy-harness.test.cjs test-lab/llc60-planning-loop.test.cjs test-lab/ua-decision-fidelity.test.cjs
  deno-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Supabase GSA MCP Edge Function
        run: deno check supabase/functions/gsa-mcp/index.ts
